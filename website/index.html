<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Yasmin 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 50%, #fde2e4 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- شاشة الورد المتساقط الناعم --- */
        #flowersOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 240, 243, 0.85);
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
            display: none;
            opacity: 1;
            transition: opacity 1.2s ease-out;
        }

        .flower-petal {
            position: absolute;
            top: -100px;
            user-select: none;
            animation: fall linear forwards;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(115vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* --- مشغل الموسيقى المثبت --- */
        .music-control-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
            border: 1px solid #ffccd5;
        }

        .music-btn {
            background: #ff85a1;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            outline: none;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: #ff4d6d;
        }

        .music-status {
            font-size: 0.85rem;
            color: #5c474e;
            font-weight: 700;
        }

        /* --- شاشة القفل --- */
        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 90vh;
            text-align: center;
        }

        .flower-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        .lock-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #5c474e;
            font-weight: 700;
        }

        .pass-input {
            background: #ffffff;
            border: 2px solid #ffccd5;
            padding: 14px 20px;
            border-radius: 25px;
            color: #4a4a4a;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            width: 240px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
            transition: 0.3s;
        }

        .pass-input:focus {
            border-color: #ffb3c1;
            box-shadow: 0 0 15px rgba(255, 179, 193, 0.5);
        }

        .unlock-btn {
            margin-top: 20px;
            background: #ffb3c1;
            color: #ffffff;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 179, 193, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .unlock-btn:hover {
            transform: scale(1.05);
            background: #ff85a1;
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.95rem;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        /* --- المحتوى الرئيسي --- */
        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .main-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 1.9rem;
            color: #5c474e;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .main-header p {
            color: #8c707b;
            font-size: 1rem;
        }

        /* قائمة الكروت */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(220, 160, 175, 0.18);
            border: 1px solid #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 380px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .card-caption {
            background: #fff0f3;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5c474e;
            text-align: center;
            font-weight: 600;
            border-right: 4px solid #ff85a1;
        }

        /* --- تصميم قسم الجواب / الرسالة الخاصة --- */
        .letter-section {
            width: 100%;
            margin-top: 40px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .envelope-btn {
            background: linear-gradient(135deg, #ffb3c1 0%, #ff85a1 100%);
            color: #ffffff;
            border: none;
            padding: 18px 30px;
            border-radius: 30px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 133, 161, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .envelope-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 133, 161, 0.45);
        }

        .letter-card {
            display: none;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 12px 35px rgba(220, 160, 175, 0.25);
            border: 2px dashed #ffccd5;
            animation: fadeIn 0.6s ease-in-out forwards;
            text-align: center;
            position: relative;
        }

        .letter-title {
            color: #ff4d6d;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .letter-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #5c474e;
            font-weight: 600;
            white-space: pre-line;
            text-align: right;
            padding: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- طبقة تساقط الورد الناعم -->
    <div id="flowersOverlay"></div>

    <!-- ملف الأغنية -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <!-- 1. شاشة القفل -->
    <div id="lockScreen">
        <div class="flower-icon">🌸</div>
        <div class="lock-title">ادخلي الباسورد عشان تفتحي السر ❤️</div>
        <input type="password" id="passInput" class="pass-input" placeholder="اكتبي الباسورد...">
        <button class="unlock-btn" onclick="checkPassword()">افتحي 🌺</button>
        <div id="errorMsg" class="error-msg">الباسورد مش صح، جربي تاني 😉</div>
    </div>

    <!-- 2. المحتوى الرئيسي -->
    <div id="mainContent">
        
        <!-- مشغل الأغنية التفاعلي -->
        <div class="music-control-bar">
            <button id="musicToggleBtn" class="music-btn" onclick="toggleMusic()">🔊</button>
            <span id="musicStatus" class="music-status">الأغنية شغالة 🎵</span>
        </div>

        <div class="main-header">
            <h1>🌸 ذكرياتنا الجميلة 🌸</h1>
            <p>عشان انتي ياسمين❤️</p>
        </div>

        <!-- قائمة الكروت -->
        <div class="cards-list" id="cardsList"></div>

        <!-- قسم الجواب والرسالة الخاصة -->
        <div class="letter-section">
            <button class="envelope-btn" onclick="openLetter()">
                <span>💌 اضغطي هنا لفتح جوابك الخاص</span>
            </button>
            
            <div class="letter-card" id="letterCard">
                <div class="letter-title">💌 رسالة من القلب</div>
                <div class="letter-body" id="letterText">
                    هتفضلي انتي اهم و اغلي حد عرفته في حياتي
                    و اليوم ده هيفضل احلي يوم عيشته في حياتي و نفسي يتكرر
                    و مهما حصل مش عايزك تزعلي مني
                    عشان زعلك غالي عليا❤️
                    ✨
                </div>
            </div>
        </div>

    </div>

    <script>
        const CORRECT_PASS = "soso";

        const slidesData = [
            {
                img: 'photo4.jpg',
                text: 'قعد فتره زعلان ان دي صورتنا الوحيده و كنت بدعي ربنا اننا نتقابل تاني✨'
            },
            {
                img: 'photo1.jpg',
                text: 'اليوم ده هيفضل احلا و اجمل يوم في حياتي مع اجمل حد شوفتها في حياتي ❤️ ✨'
            },
            {
                img: 'photo2.jpg',
                text: '❤️'
            },
            {
                img: 'photo3.jpg',
                text: '🌸'
            }
        ];

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === CORRECT_PASS) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                
                playMusic();
                renderCards();

                // تفعيل تساقط الورد الأولاني
                startFlowerShower();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // تساقط الورد الناعم المبهج
        function startFlowerShower() {
            const overlay = document.getElementById('flowersOverlay');
            overlay.style.display = 'block';
            overlay.style.opacity = '1';
            overlay.innerHTML = '';

            const flowerIcons = ['🌸', '🌺', '🌹', '🌷', '✨', '💖'];
            const totalFlowers = 70;

            for (let i = 0; i < totalFlowers; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'flower-petal';
                    petal.innerText = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
                    
                    const size = (Math.random() * 2 + 1.8) + 'rem';
                    petal.style.fontSize = size;
                    
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    
                    overlay.appendChild(petal);
                }, i * 40);
            }

            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1200);
            }, 3000);
        }

        function openLetter() {
            const letterCard = document.getElementById('letterCard');
            if (letterCard.style.display === 'block') {
                letterCard.style.display = 'none';
            } else {
                letterCard.style.display = 'block';
            }
        }

        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggleBtn');
        const musicStatus = document.getElementById('musicStatus');

        function playMusic() {
            audio.play().then(() => {
                musicBtn.innerText = '🔊';
                musicStatus.innerText = 'الأغنية شغالة 🎵';
            }).catch(e => console.log("الصوت محتاج تفاعل"));
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                musicBtn.innerText = '🔊';
                musicStatus.innerText = 'الأغنية شغالة 🎵';
            } else {
                audio.pause();
                musicBtn.innerText = '🔇';
                musicStatus.innerText = 'الأغنية متوقفة ⏸️';
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsList');
            container.innerHTML = '';

            slidesData.forEach((slide) => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <img class="card-img" src="${slide.img}" alt="صورة" onerror="this.style.display='none'">
                    <div class="card-caption">${slide.text}</div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
