<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Yasmin 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 50%, #fde2e4 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* --- شاشة القفل --- */
        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 90vh;
            text-align: center;
        }

        .flower-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        .lock-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #5c474e;
            font-weight: 700;
        }

        .pass-input {
            background: #ffffff;
            border: 2px solid #ffccd5;
            padding: 14px 20px;
            border-radius: 25px;
            color: #4a4a4a;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            width: 240px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
            transition: 0.3s;
        }

        .pass-input:focus {
            border-color: #ffb3c1;
            box-shadow: 0 0 15px rgba(255, 179, 193, 0.5);
        }

        .unlock-btn {
            margin-top: 20px;
            background: #ffb3c1;
            color: #ffffff;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 179, 193, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .unlock-btn:hover {
            transform: scale(1.05);
            background: #ff85a1;
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.95rem;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        /* --- المحتوى الرئيسي --- */
        #mainContent {
            display: none;
            width: 100%;
            max-width: 420px;
            flex-direction: column;
            align-items: center;
        }

        .main-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 1.8rem;
            color: #5c474e;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .main-header p {
            color: #8c707b;
            font-size: 0.95rem;
        }

        /* قائمة الكروت تحت بعضها */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(220, 160, 175, 0.15);
            border: 1px solid #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 280px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card-caption {
            background: #fff0f3;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            color: #5c474e;
            text-align: center;
            font-weight: 600;
            border-right: 4px solid #ff85a1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة القفل -->
    <div id="lockScreen">
        <div class="flower-icon">🌸</div>
        <div class="lock-title">ادخلي الباسورد عشان تفتحي السر ❤️</div>
        <input type="password" id="passInput" class="pass-input" placeholder="اكتبي الباسورد...">
        <button class="unlock-btn" onclick="checkPassword()">افتحي 🌺</button>
        <div id="errorMsg" class="error-msg">الباسورد مش صح، جربي تاني 😉</div>
    </div>

    <!-- 2. المحتوى الرئيسي -->
    <div id="mainContent">
        <div class="main-header">
            <h1>🌸 ذكرياتنا الجميلة 🌸</h1>
            <p>كل صورة وراها حكاية وفكرة ❤️</p>
        </div>

        <div class="cards-list" id="cardsList"></div>
    </div>

    <script>
        const CORRECT_PASS = "soso";

        const slidesData = [
            {
                img: 'photo1.jpg',
                text: 'اليوم ده هيفضل احلا و اجمل يوم في حياتي مع اجمل حد شوفتها في حياتي ❤️ ✨'
            },
            {
                img: 'photo2.jpg',
                text: '❤️'
            },
            {
                img: 'photo3.jpg',
                text: '🌸'
            }
        ];

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === CORRECT_PASS) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                renderCards();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsList');
            container.innerHTML = '';

            slidesData.forEach((slide) => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <img class="card-img" src="${slide.img}" alt="صورة">
                    <div class="card-caption">${slide.text}</div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
