<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Yasmin 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* شاشة القفل */
        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            text-align: center;
        }

        .flower-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        .lock-title {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            font-weight: 600;
        }

        .pass-input {
            background: #181818;
            border: 1.5px solid #333;
            padding: 14px 20px;
            border-radius: 25px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            width: 230px;
            transition: 0.3s;
        }

        .pass-input:focus {
            border-color: #ff85a1;
            box-shadow: 0 0 12px rgba(255, 133, 161, 0.3);
        }

        .unlock-btn {
            margin-top: 18px;
            background: #ff85a1;
            color: #121212;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .unlock-btn:hover {
            transform: scale(1.05);
            background: #fbb1bd;
        }

        .error-msg {
            color: #ff85a1;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }

        /* المحتوى الرئيسي */
        #mainContent {
            display: none;
            width: 100%;
            max-width: 380px;
            flex-direction: column;
            align-items: center;
        }

        .flowers-header {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        .cards-stack {
            position: relative;
            width: 100%;
            height: 420px;
            margin-bottom: 25px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 25px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease-in-out;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9) translateY(20px);
        }

        .card.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
            z-index: 3;
        }

        .card.next {
            opacity: 0.6;
            transform: scale(0.95) translateY(12px);
            z-index: 2;
        }

        .card-img {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #252525;
        }

        .card-caption {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f0f0f0;
            text-align: center;
            padding: 0 10px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .action-btn {
            background: transparent;
            border: 1.5px solid #ff85a1;
            color: #ff85a1;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #ff85a1;
            color: #121212;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة القفل -->
    <div id="lockScreen">
        <div class="flower-icon">🌸</div>
        <div class="lock-title">ادخلي الباسورد عشان تفتحي السر ❤️</div>
        <input type="password" id="passInput" class="pass-input" placeholder="Enter password...">
        <button class="unlock-btn" onclick="checkPassword()">افتحي 🌺</button>
        <div id="errorMsg" class="error-msg">الباسورد مش صح، جربي تاني 😉</div>
    </div>

    <!-- 2. المحتوى الرئيسي -->
    <div id="mainContent">
        <div class="flowers-header">🌸 🌺 🌸</div>

        <div class="cards-stack" id="cardsStack"></div>

        <button class="action-btn" onclick="nextCard()">التالية 🌸</button>
    </div>

    <script>
        const CORRECT_PASS = "soso";

        // استخدام الصور المحلية المباشرة بدون أي سيرفرات خارجية
        const slidesData = [
            {
                img: 'photo1.jpg',
                text: 'الرسالة الأولى: اكتب الكلام هنا..'
            },
            {
                img: 'photo2.jpg',
                text: 'الرسالة الثانية: اكتب الكلام هنا..'
            },
            {
                img: 'photo3.jpg',
                text: 'الرسالة الثالثة: اكتب الكلام هنا..'
            }
        ];

        let currentIndex = 0;

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === CORRECT_PASS) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                renderCards();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsStack');
            container.innerHTML = '';

            slidesData.forEach((slide, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;

                card.innerHTML = `
                    <img class="card-img" src="${slide.img}" alt="صورة">
                    <div class="card-caption">${slide.text}</div>
                `;

                container.appendChild(card);
            });

            updateCardsState();
        }

        function updateCardsState() {
            slidesData.forEach((_, index) => {
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    card.classList.remove('active', 'next');

                    if (index === currentIndex) {
                        card.classList.add('active');
                    } else if (index === (currentIndex + 1) % slidesData.length) {
                        card.classList.add('next');
                    }
                }
            });
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % slidesData.length;
            updateCardsState();
        }
    </script>
</body>
</html>
